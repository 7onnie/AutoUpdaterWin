# ============================================================================
# AutoUpdaterWin - GitHub Actions Template
# ============================================================================
# This workflow automatically creates GitHub releases when SCRIPT_VERSION changes
#
# Usage:
#   1. Copy this file to: .github/workflows/release.yml
#   2. Commit and push to GitHub
#   3. Workflow triggers on changes to *.cmd or *.bat files
#   4. Release is created automatically
#
# Requirements:
#   - Script must have: SET SCRIPT_VERSION=x.y.z
#   - Repository needs: permissions.contents: write
#   - Windows runner for proper PowerShell support
# ============================================================================

name: Auto Release on Version Change

# Trigger on push to main branch when .cmd or .bat files change
on:
  push:
    branches:
      - main
      - master  # Support both naming conventions
    paths:
      - '*.cmd'
      - '*.bat'

# Required: Write permission for creating releases
permissions:
  contents: write

jobs:
  check-and-release:
    # IMPORTANT: Use windows-latest for proper PowerShell support
    runs-on: windows-latest

    steps:
      # Step 1: Checkout code with history
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Fetch last 2 commits to detect changes

      # Step 2: Find script and create release
      - name: Find script and create release
        shell: powershell
        run: |
          # ===================================================================
          # Find Script File
          # ===================================================================
          Write-Host "Searching for Windows script files..."

          # Look for .cmd files first, then .bat
          $SCRIPT = Get-ChildItem -Filter "*.cmd" -File |
                    Select-Object -First 1 -ExpandProperty Name

          if (-not $SCRIPT) {
            $SCRIPT = Get-ChildItem -Filter "*.bat" -File |
                      Select-Object -First 1 -ExpandProperty Name
          }

          if (-not $SCRIPT) {
            Write-Error "ERROR: No .cmd or .bat file found in repository root"
            exit 1
          }

          Write-Host "Found script: $SCRIPT"

          # ===================================================================
          # Extract Version
          # ===================================================================
          Write-Host "Extracting version from script..."

          $CONTENT = Get-Content $SCRIPT -Raw

          # Match: SET SCRIPT_VERSION=1.0.0 (with or without quotes)
          if ($CONTENT -match '(?im)^SET\s+SCRIPT_VERSION=(["]?)([^"\r\n]+)\1') {
            $VERSION = $matches[2].Trim()
            Write-Host "Current version: $VERSION"
          } else {
            Write-Error "ERROR: SCRIPT_VERSION not found in $SCRIPT"
            Write-Host "Expected format: SET SCRIPT_VERSION=1.0.0"
            exit 1
          }

          # Validate version format (semantic versioning)
          if ($VERSION -notmatch '^\d+\.\d+\.\d+') {
            Write-Warning "Version '$VERSION' does not follow semantic versioning (x.y.z)"
          }

          # ===================================================================
          # Check if Release Already Exists
          # ===================================================================
          Write-Host "Checking if release v$VERSION already exists..."

          gh release view "v$VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Release v$VERSION already exists - skipping creation"
            exit 0
          }

          # ===================================================================
          # Create GitHub Release
          # ===================================================================
          Write-Host "Creating release v$VERSION..."

          # Generate release notes
          $RELEASE_NOTES = @"
          ## Release v$VERSION

          Automatic release created by GitHub Actions.

          ### Installation

          Download \`$SCRIPT\` and run it. The script includes auto-update capability using [AutoUpdaterWin](https://github.com/7onnie/AutoUpdaterWin).

          ### Changes

          See commit history for details.

          ---

          🤖 Generated with [AutoUpdaterWin](https://github.com/7onnie/AutoUpdaterWin)
          "@

          # Create release with script as asset
          gh release create "v$VERSION" $SCRIPT `
            --title "Release v$VERSION" `
            --notes $RELEASE_NOTES `
            --latest

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Release v$VERSION created successfully!"
            Write-Host "📦 Asset: $SCRIPT"
            Write-Host "🔗 URL: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$VERSION"
          } else {
            Write-Error "❌ Failed to create release v$VERSION"
            exit 1
          }

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Summary (optional)
      - name: Job summary
        if: success()
        shell: powershell
        run: |
          $SCRIPT = (Get-ChildItem -Filter "*.cmd")[0].Name
          if (-not $SCRIPT) {
            $SCRIPT = (Get-ChildItem -Filter "*.bat")[0].Name
          }

          $CONTENT = Get-Content $SCRIPT -Raw
          if ($CONTENT -match '(?im)^SET\s+SCRIPT_VERSION=(["]?)([^"\r\n]+)\1') {
            $VERSION = $matches[2].Trim()

            Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            Write-Host "✅ Release Created Successfully"
            Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            Write-Host "Script:  $SCRIPT"
            Write-Host "Version: $VERSION"
            Write-Host "Tag:     v$VERSION"
            Write-Host "URL:     https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$VERSION"
            Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          }

# ============================================================================
# Configuration Notes
# ============================================================================
#
# Customization Options:
# ----------------------
#
# 1. Change trigger branches:
#    on:
#      push:
#        branches: [ main, develop, staging ]
#
# 2. Add more file patterns:
#    paths:
#      - '*.cmd'
#      - '*.bat'
#      - '*.ps1'
#
# 3. Use specific Windows version:
#    runs-on: windows-2022
#    runs-on: windows-2019
#
# 4. Add pre-release flag for beta versions:
#    gh release create "v$VERSION" $SCRIPT --prerelease
#
# 5. Add multiple assets:
#    gh release create "v$VERSION" script.cmd README.md config.json
#
# 6. Custom release notes from file:
#    gh release create "v$VERSION" $SCRIPT --notes-file CHANGELOG.md
#
# ============================================================================
# Troubleshooting
# ============================================================================
#
# Problem: "SCRIPT_VERSION not found"
# Solution: Verify script has: SET SCRIPT_VERSION=1.0.0 (no quotes!)
#
# Problem: "Permission denied"
# Solution: Add to workflow file:
#   permissions:
#     contents: write
#
# Problem: "Release already exists"
# Solution: This is normal - workflow skips if release exists
#
# Problem: "No .cmd file found"
# Solution: Ensure script is in repository root (not subfolder)
#
# ============================================================================
